<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Archivos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 20px;
        }
        .container {
            max-width: 800px;
        }
        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            margin: 20px 0;
            background-color: #f8f9fa;
        }
        .upload-area:hover {
            background-color: #e9ecef;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">Sistema de Procesamiento de Archivos</h1>
        
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Subir Archivos</h5>
            </div>
            <div class="card-body">
                <form action="/upload" method="post" enctype="multipart/form-data" id="upload-form">
                    <div class="upload-area" id="drop-area">
                        <p>Arrastra archivos aquí o haz clic para seleccionar</p>
                        <input type="file" name="files[]" id="file-input" multiple class="d-none">
                        <button type="button" id="select-files" class="btn btn-outline-primary">Seleccionar Archivos</button>
                    </div>
                    
                    <div id="file-list" class="mt-3"></div>
                    
                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-primary" id="upload-button" disabled>
                            Procesar Archivos
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Selección de elementos DOM
        const dropArea = document.getElementById('drop-area');
        const fileInput = document.getElementById('file-input');
        const selectButton = document.getElementById('select-files');
        const fileList = document.getElementById('file-list');
        const uploadButton = document.getElementById('upload-button');
        
        // Eventos para drag & drop
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, preventDefaults, false);
        });
        
        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }
        
        ['dragenter', 'dragover'].forEach(eventName => {
            dropArea.addEventListener(eventName, highlight, false);
        });
        
        ['dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, unhighlight, false);
        });
        
        function highlight() {
            dropArea.classList.add('bg-light');
        }
        
        function unhighlight() {
            dropArea.classList.remove('bg-light');
        }
        
        // Manejar soltar archivos
        dropArea.addEventListener('drop', handleDrop, false);
        
        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            fileInput.files = files;
            updateFileList();
        }
        
        // Manejar selección de archivos por botón
        selectButton.addEventListener('click', () => {
            fileInput.click();
        });
        
        fileInput.addEventListener('change', updateFileList);
        
        // Actualizar la lista de archivos
        function updateFileList() {
            fileList.innerHTML = '';
            
            if (fileInput.files.length > 0) {
                const listGroup = document.createElement('ul');
                listGroup.className = 'list-group';
                
                for (const file of fileInput.files) {
                    const listItem = document.createElement('li');
                    listItem.className = 'list-group-item d-flex justify-content-between align-items-center';
                    
                    const nameSpan = document.createElement('span');
                    nameSpan.textContent = file.name;
                    
                    const sizeSpan = document.createElement('span');
                    sizeSpan.className = 'badge bg-primary rounded-pill';
                    sizeSpan.textContent = formatFileSize(file.size);
                    
                    listItem.appendChild(nameSpan);
                    listItem.appendChild(sizeSpan);
                    listGroup.appendChild(listItem);
                }
                
                fileList.appendChild(listGroup);
                uploadButton.disabled = false;
            } else {
                uploadButton.disabled = true;
            }
        }
        
        // Formatear tamaño de archivo
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
    </script>
</body>
</html>
